name: dsharp_workspace

packages:
  - packages/**

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    run: dart run melos exec -- "dart analyze ."
    description: Run static analysis in every package.
  format:
    run: dart run melos exec -- "dart format --set-exit-if-changed ."
    description: Check Dart formatting in every package.
  test:
    run: dart run melos exec -- "dart test"
    description: Run package tests.
  test:web:
    run: dart run melos exec -- "dart test -p chrome"
    description: Run package tests on Chrome, skipping VM-only test libraries.
  coverage:
    run: dart run melos exec -- "dart test --coverage=coverage"
    description: Run tests with coverage collection.
